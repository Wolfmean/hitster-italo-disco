<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hitster – Italo Disco Classics</title>

<style>
body {
    margin:0;
    background:
    linear-gradient(#14002b,#020014);
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1 {
    color:#ff4fd8;
    text-shadow:0 0 20px #ff4fd8;
}

.card {
    margin:40px auto;
    max-width:380px;
    padding:25px;
    border-radius:25px;
    background:rgba(255,255,255,0.1);
    box-shadow:
    0 0 25px #00ffff;
}

button {
    background:#00ffff;
    border:0;
    padding:15px 30px;
    border-radius:30px;
    font-size:18px;
}

.answer {
    display:none;
    margin-top:20px;
}

a {
    color:#ffff00;
}
</style>

</head>


<body>

<h1>
🎵 Hitster<br>
Italo Disco Classics
</h1>


<div class="card">

<h2 id="title">
Lade Karte...
</h2>


<a id="spotify" target="_blank">
<button>
▶️ Song öffnen
</button>
</a>


<br><br>


<button onclick="showAnswer()">
Lösung anzeigen
</button>


<div class="answer" id="answer">

<h2 id="artist"></h2>
<h3 id="song"></h3>
<p id="year"></p>

</div>

</div>


<script>

const cards = {

"001":{
artist:"Ryan Paris",
song:"Dolce Vita",
year:"1983",
spotify:"https://open.spotify.com/track/1NTqkf5y9EQS97ctstfHkQ"
},

"002":{
artist:"Gazebo",
song:"I Like Chopin",
year:"1983",
spotify:"https://open.spotify.com/track/3XAOiZ7ccldPhPjrMiUKrG"
},

"003":{
artist:"P. Lion",
song:"Happy Children",
year:"1984",
spotify:"https://open.spotify.com/track/3v08BSV25yFn8u2xigYCHk"
},

"004":{
artist:"Savage",
song:"Don't Cry Tonight",
year:"1983",
spotify:"https://open.spotify.com/search/Savage%20Don't%20Cry%20Tonight"
},

"005":{
artist:"Savage",
song:"Only You",
year:"1984",
spotify:"https://open.spotify.com/search/Savage%20Only%20You"
},

"006":{
artist:"Ken Laszlo",
song:"Hey Hey Guy",
year:"1984",
spotify:"https://open.spotify.com/search/Ken%20Laszlo%20Hey%20Hey%20Guy"
},

"007":{
artist:"Ken Laszlo",
song:"Tonight",
year:"1985",
spotify:"https://open.spotify.com/search/Ken%20Laszlo%20Tonight"
},

"008":{
artist:"Miko Mission",
song:"How Old Are You?",
year:"1984",
spotify:"https://open.spotify.com/search/Miko%20Mission%20How%20Old%20Are%20You"
},

"009":{
artist:"Baltimora",
song:"Tarzan Boy",
year:"1985",
spotify:"https://open.spotify.com/search/Baltimora%20Tarzan%20Boy"
},

"010":{
artist:"Righeira",
song:"Vamos a la Playa",
year:"1983",
spotify:"https://open.spotify.com/search/Righeira%20Vamos%20a%20la%20Playa"
}

};


let params=new URLSearchParams(window.location.search);

let number=params.get("karte") || "001";

let card=cards[number];


if(card){

document.getElementById("title").innerHTML=
"Karte "+number;


document.getElementById("artist").innerHTML=
card.artist;


document.getElementById("song").innerHTML=
card.song;


document.getElementById("year").innerHTML=
card.year;


document.getElementById("spotify").href=
card.spotify;


}


function showAnswer(){

document.getElementById("answer")
.style.display="block";

}

</script>


</body>
</html>
