<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hitster – Italo Disco Classics</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');


body {

margin:0;
min-height:100vh;

background:
linear-gradient(
180deg,
#14002b 0%,
#090022 45%,
#02000d 100%
);

color:white;
font-family:'Orbitron', Arial, sans-serif;
text-align:center;

overflow-x:hidden;

}


/* Neon Sonnenuntergang */

body:before {

content:"";

position:fixed;

bottom:0;
left:0;

width:100%;
height:45%;

background:
linear-gradient(
transparent,
rgba(255,0,180,0.25)
);

z-index:-1;

}


/* Titel */

h1 {

font-size:32px;

color:#ff4fd8;

text-shadow:

0 0 5px #ff4fd8,
0 0 15px #ff4fd8,
0 0 30px #00ffff;

}


/* Karte */


.card {

width:330px;

margin:40px auto;

padding:30px;

border-radius:25px;


background:

linear-gradient(
135deg,
rgba(255,255,255,0.12),
rgba(255,255,255,0.03)
);


border:2px solid #00ffff;


box-shadow:

0 0 15px #00ffff,
0 0 35px #ff00cc;


backdrop-filter:blur(10px);


}


/* Neon Buttons */


button {

font-family:'Orbitron';

background:

linear-gradient(
90deg,
#00ffff,
#ff00cc
);

border:none;

padding:15px 25px;

margin:12px 0;

border-radius:50px;

font-size:16px;

cursor:pointer;

box-shadow:

0 0 15px #00ffff;

display:inline-block;

}



button:hover {

transform:scale(1.08);

}



/* Spotify */

.spotify {


display:inline-block;

margin:20px;


}



/* Lösung */


.answer {

display:none;

margin-top:25px;

border-top:

1px solid #ff00cc;

padding-top:20px;


color:#ffff00;


}



/* Retro Grid */


.grid {


position:fixed;

bottom:0;

left:0;

width:100%;

height:120px;


background:

linear-gradient(
90deg,
transparent 95%,
#ff00cc 96%
),

linear-gradient(
0deg,
transparent 95%,
#00ffff 96%
);


background-size:

40px 40px;


opacity:0.25;


z-index:-1;


}


</style>

</head>


<body>


<div class="grid"></div>



<h1>

🎵 HITSTER<br>

ITALO DISCO CLASSICS

</h1>



<div class="card">


<h2 id="title">
Karte laden...
</h2>


<a id="spotify" target="_blank">

<button>
🎧 SONG STARTEN
</button>

</a>



<br>


<button onclick="showAnswer()">
💡 LÖSUNG ANZEIGEN
</button>



<div class="answer" id="answer">


<h2 id="artist"></h2>

<h3 id="song"></h3>

<p id="year"></p>


</div>


</div>





<script>


const cards = {


"001":{

artist:"Ryan Paris",

song:"Dolce Vita",

year:"1983",

spotify:"https://open.spotify.com/track/1NTqkf5y9EQS97ctstfHkQ"

},


"002":{

artist:"Gazebo",

song:"I Like Chopin",

year:"1983",

spotify:"https://open.spotify.com/track/3XAOiZ7ccldPhPjrMiUKrG"

}

};



let params =
new URLSearchParams(window.location.search);


let number =
params.get("karte") || "001";


let card =
cards[number];


if(card){


document.getElementById("title").innerHTML =
"KARTE " + number;


document.getElementById("artist").innerHTML =
card.artist;


document.getElementById("song").innerHTML =
card.song;


document.getElementById("year").innerHTML =
card.year;


document.getElementById("spotify").href =
card.spotify;


}




function showAnswer(){

document.getElementById("answer")
.style.display="block";

}


</script>



</body>
</html>
