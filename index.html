<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hitster – Italo Disco Classics</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');


* {
box-sizing:border-box;
}


html,body {

margin:0;
padding:0;

min-height:100%;

}


body {

background:
linear-gradient(
180deg,
#120022,
#050010
);

color:white;

font-family:'Orbitron',Arial,sans-serif;

text-align:center;

overflow-x:hidden;
overflow-y:auto;

}


/* Sterne */

body:before {

content:"";

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:
radial-gradient(circle,#ffffff55 1px,transparent 2px);

background-size:60px 60px;

opacity:.25;

z-index:-3;

}


/* Sonne */

.sun {

position:fixed;

bottom:170px;

left:50%;

transform:translateX(-50%);

width:150px;

height:150px;

border-radius:50%;


background:

linear-gradient(
#ffff00,
#ff8800,
#ff0088
);


box-shadow:

0 0 40px #ff00cc;

z-index:-2;

}


/* Horizont */

.horizon {

position:fixed;

bottom:0;

width:100%;

height:200px;

background:

linear-gradient(
transparent,
#ff0088
);

opacity:.35;

z-index:-2;

}


/* Raster */

.grid {

position:fixed;

bottom:0;

width:100%;

height:120px;

background:

linear-gradient(
90deg,
transparent 95%,
#00ffff 96%
),

linear-gradient(
0deg,
transparent 95%,
#ff00cc 96%
);


background-size:40px 40px;

transform:
perspective(300px)
rotateX(60deg);


opacity:.35;

z-index:-1;

}


/* Überschrift */

h1 {

font-size:30px;

color:#ff4fd8;

text-shadow:

0 0 10px #ff00cc,
0 0 30px #00ffff;

margin-top:30px;

}



/* Karte */


.card {

width:350px;

max-width:90%;

margin:30px auto 80px;

padding:25px;


background:

rgba(255,255,255,.12);


border:

2px solid #00ffff;


border-radius:25px;


box-shadow:

0 0 25px #00ffff,
0 0 40px #ff00cc;

}



/* Nummer */


.card-number {

display:inline-block;

padding:10px 25px;

border-radius:30px;

border:2px solid #ffff00;

color:#ffff00;

box-shadow:

0 0 15px #ffff00;

}



/* Platte */


.record {

width:100px;

height:100px;

margin:20px auto;


border-radius:50%;


background:

radial-gradient(
circle,
#ff00cc 0%,
#111 12%,
#000 60%,
#222 100%
);


box-shadow:

0 0 20px #00ffff;


animation:

spin 5s linear infinite;

}



@keyframes spin {

from {

transform:rotate(0deg);

}

to {

transform:rotate(360deg);

}

}



/* Buttons */


button {

font-family:'Orbitron';

background:

linear-gradient(
90deg,
#00ffff,
#ff00cc
);


border:none;

padding:15px 25px;

margin:15px 5px;

border-radius:50px;

font-size:15px;

cursor:pointer;


box-shadow:

0 0 20px #00ffff;


}



button:hover {

transform:scale(1.05);

}



/* Lösung */


.answer {

display:none;

margin-top:25px;

padding-top:20px;

border-top:

1px solid #ff00cc;

color:#ffff00;

line-height:1.6;

}



/* Handy Anpassung */


@media(max-width:600px){


h1 {

font-size:24px;

}


.card {

padding:20px;

}


button {

width:90%;

}


.record {

width:90px;

height:90px;

}

}


</style>

</head>


<body>


<div class="sun"></div>

<div class="horizon"></div>

<div class="grid"></div>



<h1>
🎵 HITSTER<br>
ITALO DISCO CLASSICS
</h1>



<div class="card">


<div class="card-number" id="number">
CARD 001
</div>



<div class="record"></div>



<h2 id="title">
RATE DEN SONG
</h2>



<a id="spotify" target="_blank">

<button>
🎧 SONG STARTEN
</button>

</a>


<button onclick="showAnswer()">
💡 LÖSUNG ANZEIGEN
</button>



<div class="answer" id="answer">

<h2 id="artist"></h2>

<h3 id="song"></h3>

<p id="year"></p>

</div>


</div>




<script>


const cards = {


"001":{

artist:"Ryan Paris",

song:"Dolce Vita",

year:"1983",

spotify:"https://open.spotify.com/track/1NTqkf5y9EQS97ctstfHkQ"

},


"002":{

artist:"Gazebo",

song:"I Like Chopin",

year:"1983",

spotify:"https://open.spotify.com/track/3XAOiZ7ccldPhPjrMiUKrG"

}


};



let params =
new URLSearchParams(window.location.search);


let number =
params.get("karte") || "001";


let card =
cards[number];



if(card){


document.getElementById("number").innerHTML =
"CARD "+number;


document.getElementById("spotify").href =
card.spotify;


document.getElementById("artist").innerHTML =
card.artist;


document.getElementById("song").innerHTML =
card.song;


document.getElementById("year").innerHTML =
card.year;


}




function showAnswer(){

document.getElementById("answer").style.display="block";

}



</script>


</body>

</html>
